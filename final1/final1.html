<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .ana{
            display: flex;
            background: darkgray;
            
            height: 800px;
            
            flex-direction: column;
        }

        .bas{
            background-color: antiquewhite;
            height: 30%;
            display: flex;
            
    
        }

        .orta{
            background-color: rgba(250, 235, 215, 0.5);
            height: 60%;
            display: flex;
            
    
            flex-direction: column;
        }

        .son{
            background-color: rgba(250, 235, 215, 0.747);
            height: 10%;
            display: flex;
            
            
        }

        .b1{
            background-color: aqua;
            display: flex;
            flex: 1;
        }
        .b2{
            background-color: rgb(0, 156, 156);
            display: flex;
            flex: 1;
        }

        .o1{
            background-color: chocolate;
            display: flex;
            flex: 1;
        }
        .o2{
            background-color: rgb(209, 88, 2);
            display: flex;
            flex: 1;
        }

        .s1{
            background-color: rgb(151, 255, 130);
            
            display: flex;
            flex: 1;

        }
        .s2{
            background-color: rgb(84, 255, 49);
            display: flex;
            flex: 1;

        }
        .s3{
            background-color: rgb(37, 209, 2);
            display: flex;
            flex: 1;

        }
        

    </style>

</head>
<body>
    <div class="ana">
        <div class="bas">
            <div class="b1">q</div>
            <div class="b2">q</div>
        </div>

        <div class="orta">
            <div class="o1">d</div>
            <div class="o2"></div>
        </div>

        <div class="son">
            <div class="s1"></div>
            <div class="s2"></div>
            <div class="s3"></div>
        </div>

    </div>
    
</body>
</html>
